<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        form {
            max-width: 700px;
        }

        fieldset {
            border: 2px solid #555;
            border-radius: 6px;
            margin-bottom: 20px;
            padding: 15px 20px;
        }

        legend {
            font-weight: bold;
            padding: 0 8px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        input[type="file"],
        select,
        textarea {
            box-sizing: border-box;
            width: 100%;
            margin-top: 6px;
            padding: 7px;
            border: 1px solid #888;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 6px;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 10px;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 7px 14px;
            border: 1px solid #444;
            border-radius: 4px;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <h1>Formulario de registro</h1>
    <p>Completa los siguientes datos.</p>

    <form action="/submit" method="post" enctype="multipart/form-data" autocomplete="on">

        <input type="hidden" name="user_id" value="12345">

        <fieldset>
            <legend>Datos de acceso</legend>

            <p>
                <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="30"
                    autocomplete="username" placeholder="Escribe tu usuario">
            </p>

            <p>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required minlength="6" maxlength="20"
                    autocomplete="new-password" placeholder="Escribe tu contraseña">
            </p>

            <p>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                    placeholder="correo@ejemplo.com">
            </p>
        </fieldset>

        <fieldset>
            <legend>Información personal</legend>

            <p>
                <label for="age">Edad:</label>
                <input type="number" id="age" name="age" min="0" max="100" required>
            </p>

            <p>
                <span>Género:</span>
            </p>

            <p>
                <input type="radio" id="gender-male" name="gender" value="male" required>
                <label for="gender-male">Masculino</label>
            </p>

            <p>
                <input type="radio" id="gender-female" name="gender" value="female">
                <label for="gender-female">Femenino</label>
            </p>

            <p>
                <label for="birthday">Fecha de nacimiento:</label>
                <input type="date" id="birthday" name="birthday" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Preferencias y contacto</legend>

            <p>
                <input type="checkbox" id="subscribe" name="subscribe" value="newsletter">
                <label for="subscribe">Deseo suscribirme al boletín</label>
            </p>

            <p>
                <label for="country">País:</label>
                <select id="country" name="country" required>
                    <option value="">Selecciona un país</option>
                    <option value="co">Colombia</option>
                    <option value="us">Estados Unidos</option>
                    <option value="ca">Canadá</option>
                    <option value="uk">Reino Unido</option>
                </select>
            </p>

            <p>
                <label for="volume">Nivel de interés:</label>
                <input type="range" id="volume" name="volume" min="0" max="100" value="50">
            </p>

            <p>
                <label for="message">Mensaje:</label>
                <textarea id="message" name="message" rows="4" cols="50" maxlength="500"
                    placeholder="Escribe tu mensaje"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Documentos</legend>

            <p>
                <label for="resume">Adjuntar hoja de vida:</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
            </p>
        </fieldset>

        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Limpiar formulario</button>
        </p>

    </form>
</body>

</html>
