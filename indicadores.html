<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores del formulario</title>
</head>

<body>
    <h1>Indicadores del formulario</h1>

    <form action="#" method="get" oninput="resultado.value=parseInt(a.value) + parseInt(b.value)">

        <fieldset>
            <legend>Suma de valores</legend>

            <p>
                <label for="a">Primer número:</label>
                <input type="number" id="a" name="a" value="0" min="0" required>
            </p>

            <p>
                <label for="b">Segundo número:</label>
                <input type="number" id="b" name="b" value="0" min="0" required>
            </p>

            <p>
                <label for="resultado">Resultado:</label>
                <output id="resultado" name="resultado" for="a b">0</output>
            </p>
        </fieldset>

        <fieldset>
            <legend>Estado del proceso</legend>

            <p>
                <label for="carga">Progreso de carga:</label>
                <progress id="carga" value="70" max="100">70%</progress>
            </p>

            <p>
                <label for="disco">Uso de disco:</label>
                <meter id="disco" value="0.6" min="0" max="1" low="0.3" high="0.8" optimum="0.5">60%</meter>
            </p>
        </fieldset>

        <p>
            <button type="reset">Restablecer</button>
        </p>

    </form>
</body>

</html>
